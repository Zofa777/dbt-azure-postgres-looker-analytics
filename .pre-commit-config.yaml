repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: local
    hooks:
      - id: sqlfluff-lint
        name: SQLFluff lint
        entry: sqlfluff lint
        language: system
        types: [sql]
        pass_filenames: true
