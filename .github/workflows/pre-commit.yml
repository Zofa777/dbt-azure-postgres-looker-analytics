name: Pre-commit CI

on:
  pull_request:
    branches:
      - main

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pre-commit sqlfluff==4.4.0 sqlfluff-templater-dbt dbt-postgres==1.11.0

      - name: Install dbt packages
        working-directory: ./superstore_dbt
        run: dbt deps

      - name: Generate dbt manifest
        working-directory: ./superstore_dbt
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/.github/dbt
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: dbt parse --target ci

      - name: Run pre-commit
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/.github/dbt
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: pre-commit run --all-files
